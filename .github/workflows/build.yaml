name: Build and test Vibedeck

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  plugin:
    name: Test and package plugin
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          submodules: recursive
      - uses: actions/setup-node@v6
        with:
          node-version: '22'
      - uses: pnpm/action-setup@v6
        with:
          version: 10
      - uses: actions/setup-python@v6
        with:
          python-version: '3.13'
      - name: Install frontend dependencies
        run: pnpm install --frozen-lockfile
      - name: Lint
        run: pnpm run test
      - name: Typecheck
        run: pnpm run typecheck
      - name: Backend regression tests
        run: pnpm run test:backend
      - name: Build and package
        run: pnpm run build:plugin
      - uses: actions/upload-artifact@v7
        with:
          name: vibedeck
          path: |
            out/vibedeck.zip
            out/vibedeck.zip.sha256
          if-no-files-found: error

  release:
    name: Publish tagged prerelease
    if: startsWith(github.ref, 'refs/tags/v')
    needs: plugin
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v7
        with:
          name: vibedeck
          path: out
      - name: Publish package
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: gh release create "$GITHUB_REF_NAME" out/vibedeck.zip out/vibedeck.zip.sha256 --title "Vibedeck $GITHUB_REF_NAME" --prerelease --generate-notes
